name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm python3 python3-pip python-is-python3

      - name: Clone EDK2
        run: |
          git clone https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init

      - name: Setup
        run: |
          cp -R ReadSmcPkg edk2/ReadSmcPkg
          cd edk2
          make -C BaseTools

      - name: Build
        run: |
          cd edk2
          export EDK_TOOLS_PATH=$GITHUB_WORKSPACE/edk2/BaseTools
          . edksetup.sh BaseTools
          build -p $GITHUB_WORKSPACE/ReadSmcPkg/ReadSmcPkg.dsc

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReadSMC-EFI
          path: edk2/Build/ReadSMC/RELEASE_X64/ReadSMC.efi